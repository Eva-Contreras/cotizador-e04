name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0'
          
      - name: Instalar dependencias
        working-directory: ./04-sin-mutacion/ejercicios
        run: mix deps.get
        
      - name: Compilar proyecto
        working-directory: ./04-sin-mutacion/ejercicios
        run: mix compile --warnings-as-errors
        
      - name: Análisis de formato (opcional)
        working-directory: ./04-sin-mutacion/ejercicios
        run: mix format --check-formatted
        
      - name: Pruebas
        working-directory: ./04-sin-mutacion/ejercicios
        run: mix test test/sin_mutacion_test.exs